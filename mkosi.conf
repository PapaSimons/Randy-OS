[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware
# Pin package inputs as well as the mkosi version in CI.
Snapshot=20261001T000000Z

[Output]
Format=disk
Output=randy-os-alpha2-x86_64
OutputDirectory=mkosi.output
ManifestFormat=json
Seed=9b54fa94-cb6a-4c51-b991-489cbb421610

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
UnifiedKernelImages=unsigned
Hostname=randy
Locale=C.UTF-8
RootPassword=hashed:!
Autologin=no
Ssh=never
WithRecommends=no
Packages=
    systemd-sysv
    systemd-timesyncd
    systemd-boot-efi
    linux-image-amd64
    udev
    dbus
    network-manager
    python3
    iw
    wpasupplicant
    wireless-regdb
    firmware-iwlwifi
    firmware-realtek
    firmware-mediatek
    avahi-daemon
    libnss-mdns
    alsa-utils
    openssh-server
    ca-certificates
    iproute2
    tzdata
    perl
    libgcc-s1
    libstdc++6
    zlib1g
    libio-socket-ssl-perl
    libcrypt-openssl-rsa-perl
    procps
    psmisc
    libasound2t64
    libflac14
    libvorbisfile3
    libfaad2
    libmad0
    libmpg123-0t64
    libsoxr0
    libopusfile0
    libssl3t64
BuildPackages=
    build-essential
    pkgconf
    binutils
    libasound2-dev
    libflac-dev
    libvorbis-dev
    libfaad-dev
    libmad0-dev
    libmpg123-dev
    libsoxr-dev
    libopusfile-dev
    libssl-dev
RemoveFiles=
    /etc/ssh/ssh_host_*
    /etc/localtime
    /etc/timezone
    /var/lib/dbus/machine-id
SourceDateEpoch=1790812800

[Validation]
SecureBoot=no

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreeSnapshot=20261001T000000Z

# Only build hooks fetch the pinned sources/npm lockfile; never appliance boot.
WithNetwork=yes
BuildSourcesEphemeral=yes
