[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware
# Pin package inputs as well as the mkosi version in CI.
Snapshot=20261001T000000Z

[Output]
Format=disk
Output=randy-os-alpha1-x86_64
OutputDirectory=mkosi.output
ManifestFormat=json
Seed=9b54fa94-cb6a-4c51-b991-489cbb421610

[Content]
Bootable=yes
Bootloader=systemd-boot
BiosBootloader=none
UnifiedKernelImages=unsigned
Hostname=randy
Locale=C.UTF-8
RootPassword=hashed:!
Autologin=no
Ssh=never
WithRecommends=no
Packages=
    systemd-sysv
    systemd-timesyncd
    systemd-boot-efi
    linux-image-amd64
    udev
    dbus
    network-manager
    wpasupplicant
    wireless-regdb
    firmware-iwlwifi
    firmware-realtek
    firmware-mediatek
    avahi-daemon
    libnss-mdns
    alsa-utils
    openssh-server
    ca-certificates
    iproute2
    tzdata
RemoveFiles=
    /etc/ssh/ssh_host_*
    /etc/localtime
    /etc/timezone
    /var/lib/dbus/machine-id
SourceDateEpoch=1790812800

[Validation]
SecureBoot=no

[Build]
ToolsTree=yes
ToolsTreeDistribution=debian
ToolsTreeRelease=trixie
ToolsTreeSnapshot=20261001T000000Z
