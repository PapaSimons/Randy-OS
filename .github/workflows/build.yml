name: Build Alpha 1 image
run-name: Alpha 1 · ${{ inputs.mode || 'smoke' }} · ${{ inputs.profile || 'normal' }} · ${{ github.event_name }}

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Build mode (image includes a flashable artifact; smoke uploads logs only)'
        required: true
        type: choice
        options: [image, smoke]
        default: image
      profile:
        description: 'normal or explicitly insecure local-console debug image'
        type: choice
        options: [normal, debug]
        default: normal
      ssh_public_key:
        description: 'Optional single-line SSH public key for root Alpha access (never a private key)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      MKOSI_VERSION: '27.1'
      BUILD_MODE: ${{ inputs.mode || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - name: Select image configuration
        env:
          PROFILE: ${{ inputs.profile || 'normal' }}
        run: |
          case "$BUILD_MODE" in image|smoke) ;; *) exit 2 ;; esac
          case "$PROFILE" in
            normal) echo 'IMAGE_NAME=randy-os-alpha1-x86_64' >> "$GITHUB_ENV" ;;
            debug) echo 'IMAGE_NAME=randy-os-alpha1-debug-x86_64' >> "$GITHUB_ENV" ;;
            *) exit 2 ;;
          esac
          printf '### Alpha 1 build\n\nMode: **%s**\n\nProfile: **%s**\n' "$BUILD_MODE" "$PROFILE" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore pinned package downloads
        id: packages
        uses: actions/cache/restore@v4
        with:
          path: mkosi.pkgcache
          key: mkosi-packages-${{ runner.os }}-${{ runner.arch }}-${{ env.MKOSI_VERSION }}-${{ hashFiles('mkosi.conf', 'mkosi.profiles/**/mkosi.conf') }}
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv apt debian-archive-keyring \
            bubblewrap systemd-container systemd-repart uidmap \
            util-linux fdisk e2fsprogs dosfstools binutils xz-utils zstd curl gpg python3-gi gir1.2-nm-1.0 \
            qemu-system-x86 ovmf
          # Noble's Debian keyring can predate the Trixie signing keys.
          for key in archive-key-13 archive-key-13-security release-13; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://ftp-master.debian.org/keys/${key}.asc" -o "/tmp/${key}.asc"
            gpg --batch --dearmor < "/tmp/${key}.asc" | sudo tee -a /usr/share/keyrings/debian-archive-keyring.gpg > /dev/null
          done
          python3 -m venv /tmp/mkosi-venv
          /tmp/mkosi-venv/bin/pip install "mkosi[bootable] @ https://github.com/systemd/mkosi/archive/refs/tags/v${MKOSI_VERSION}.tar.gz"
          /tmp/mkosi-venv/bin/mkosi --version
      - name: Run provisioning checks including NetworkManager keyfile compatibility
        run: |
          for script in scripts/*.sh scripts/vm-smoke/check.sh; do bash -n "$script"; done
          /usr/bin/python3 -c 'import gi; gi.require_version("NM", "1.0"); from gi.repository import NM'
          /usr/bin/python3 -m unittest discover -s tests -v
      - name: Prepare optional Alpha public key overlay
        env:
          SSH_PUBLIC_KEY: ${{ inputs.ssh_public_key }}
        run: |
          if [ -n "$SSH_PUBLIC_KEY" ]; then
            install -d -m 700 .alpha-ssh/root/.ssh
            printf '%s\n' "$SSH_PUBLIC_KEY" > .alpha-ssh/root/.ssh/authorized_keys
            ssh-keygen -l -f .alpha-ssh/root/.ssh/authorized_keys
            chmod 600 .alpha-ssh/root/.ssh/authorized_keys
            printf '[Content]\nExtraTrees=.alpha-ssh\n' > mkosi.local.conf
          fi
      - name: Build raw disk image
        id: build_image
        env:
          PROFILE: ${{ inputs.profile || 'normal' }}
        run: |
          mkdir -p mkosi.pkgcache
          args=(--package-cache-dir=mkosi.pkgcache)
          if [[ "$PROFILE" == debug ]]; then args+=(--profile=debug); fi
          sudo /tmp/mkosi-venv/bin/mkosi "${args[@]}" summary
          sudo /tmp/mkosi-venv/bin/mkosi "${args[@]}" build
      - name: Make package cache accessible to Actions
        if: always()
        run: |
          if [[ -d mkosi.pkgcache ]]; then sudo chown -R "$(id -u):$(id -g)" mkosi.pkgcache; fi
      - name: Save package downloads before boot validation
        if: ${{ success() && steps.packages.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: mkosi.pkgcache
          key: ${{ steps.packages.outputs.cache-primary-key }}
      - name: Inspect image with diagnostics
        id: validate
        shell: bash
        run: |
          set -o pipefail
          sudo scripts/validate-image.sh "mkosi.output/$IMAGE_NAME.raw" 2>&1 | tee image-validation.log
      - name: Boot UEFI image in QEMU software virtualization
        id: vm
        timeout-minutes: 12
        run: sudo scripts/vm-smoke.sh "mkosi.output/$IMAGE_NAME.raw"
      - name: Upload VM serial and host logs
        if: ${{ always() && steps.vm.outcome != 'skipped' && steps.vm.outcome != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-vm-smoke-logs
          path: vm-smoke-logs/
          if-no-files-found: warn
      - name: Upload image validation log
        if: ${{ always() && (steps.validate.outcome == 'success' || steps.validate.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: randy-os-alpha1-validation-log
          path: image-validation.log
          if-no-files-found: error
      - name: Compress image and checksum
        if: ${{ success() && env.BUILD_MODE == 'image' && steps.vm.outcome == 'success' }}
        working-directory: mkosi.output
        run: |
          sudo chown -R "$(id -u):$(id -g)" .
          xz -T2 -6 "$IMAGE_NAME.raw"
          test -s "$IMAGE_NAME.raw.xz"
          sha256sum "$IMAGE_NAME.raw.xz" > "$IMAGE_NAME.raw.xz.sha256"
          sha256sum --check "$IMAGE_NAME.raw.xz.sha256"
          # Preserve compatibility with the existing flashing instructions.
          cp "$IMAGE_NAME.raw.xz.sha256" SHA256SUMS
      - name: Upload flashable OS image
        if: ${{ success() && env.BUILD_MODE == 'image' && steps.vm.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}
          compression-level: 0
          if-no-files-found: error
          path: |
            mkosi.output/${{ env.IMAGE_NAME }}.raw.xz
            mkosi.output/${{ env.IMAGE_NAME }}.raw.xz.sha256
            mkosi.output/SHA256SUMS
            mkosi.output/*.manifest
